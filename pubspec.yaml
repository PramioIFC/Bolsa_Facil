name: bolsa_facil
description: Aplicativo Flutter para acompanhar a bolsa brasileira com dados da brapi.dev.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  fl_chart: ^0.69.0
  crypto: ^3.0.7
  intl: ">=0.19.0 <1.0.0"
  path: ^1.9.1
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
