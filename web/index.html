<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Acompanhe ações brasileiras com o Bolsa Fácil.">
  <meta name="theme-color" content="#6558F5">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolsa Fácil</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #000; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #000; color: #fff;
      font: 16px system-ui, sans-serif; padding: 24px; }
    #splash img { width: min(100%, 480px); height: auto; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Carregando o aplicativo">
    <img src="splash.png" alt="Bolsa Fácil">
    <p>Carregando...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('splash')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
